<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Comment Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <h1>LinkedIn Comment Assistant</h1>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="settings">Settings</button>
      <button class="tab" data-tab="prompts">Custom Prompts</button>
    </nav>

    <!-- Settings Tab -->
    <section id="settings-tab" class="tab-content active">
      <div class="form-group">
        <label for="api-key">
          OpenAI API Key
          <a href="https://platform.openai.com/api-keys" target="_blank" class="help-link">Get key →</a>
        </label>
        <div class="input-wrapper">
          <input type="password" id="api-key" placeholder="sk-...">
          <button type="button" id="toggle-key" class="toggle-btn" title="Show/Hide">
            <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div id="key-status" class="status"></div>
      </div>

      <button id="save-settings" class="btn-primary">Save Settings</button>
    </section>

    <!-- Custom Prompts Tab -->
    <section id="prompts-tab" class="tab-content">
      <p class="info-text">
        Add custom instructions for each tone. These will be combined with the default prompts for more personalized comments.
      </p>

      <div class="prompts-list" id="prompts-list">
        <!-- Dynamically populated -->
      </div>

      <button id="save-prompts" class="btn-primary">Save Custom Prompts</button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
      <span>•</span>
      <span>Made with ❤️</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
